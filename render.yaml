services:
  - type: web
    name: clinxia-backend
    env: node
    rootDir: server
    buildCommand: npm install --no-audit --no-fund --loglevel=http || (echo '--- NPM DEBUG LOG ---'; cat /opt/render/.cache/_logs/*-debug-0.log 2>/dev/null; exit 1)
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Legacy aliases (optional compatibility)
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
